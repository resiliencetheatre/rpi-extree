image boot.vfat {
	vfat {
		files = {
			"Image",
			"bcm2711-rpi-cm4.dtb",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		disk-signature = 0x72657465
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}
	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
