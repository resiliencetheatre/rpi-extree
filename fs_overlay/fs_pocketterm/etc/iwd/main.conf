# PocketTerm Pi 4: systemd-networkd owns DHCP and address configuration.
[General]
EnableNetworkConfiguration=false

# BCM43455 / brcmfmac with iwd 3.12 and firmware 7.45.286 failed to
# connect to the tested FRITZ!Box network with status 16. Disabling SAE
# allowed association and DHCP. Use WPA2 on mixed networks; WPA3-only
# networks are unavailable with this workaround. Revalidate before removal.
[DriverQuirks]
SaeDisable=brcmfmac
