#!/usr/bin/nft -f

flush ruleset

table inet wifi_router {
    chain forward {
        type filter hook forward priority 0;
        policy drop;

        # AP clients may initiate connections through upstream Wi-Fi.
        iifname "ap0" oifname "wlan0" accept

        # Permit return traffic from upstream.
        iifname "wlan0" oifname "ap0" \
            ct state established,related accept
    }
}

table ip wifi_nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        policy accept;

        # NAT the AP subnet through wlan0.
        oifname "wlan0" ip saddr 192.168.50.0/24 masquerade
    }
}
